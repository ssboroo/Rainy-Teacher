name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build executable
        run: |
          python -m pip install --upgrade pyinstaller pillow
          python prepare_assets.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "RainyTeacher" --icon "assets/rainy_teacher.ico" --add-data "assets/rainy_teacher_mark.png;assets" --add-data "assets/rainy_teacher.ico;assets" bagshiin_tuslah.py
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        run: iscc /DAppVersion=1.4.0 installer.iss
      - name: Save installer and portable app
        uses: actions/upload-artifact@v4
        with:
          name: Rainy-Teacher-Windows
          path: |
            dist-installer/RainyTeacher-Setup-1.4.0.exe
            dist/RainyTeacher.exe
          if-no-files-found: error
