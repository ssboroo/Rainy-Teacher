name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build executable
        run: |
          python -m pip install --upgrade pyinstaller pillow python-pptx pywin32
          python prepare_assets.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "RainyTeacher" --icon "assets/rainy_teacher.ico" --add-data "assets/rainy_teacher_mark.png;assets" --add-data "assets/rainy_teacher.ico;assets" bagshiin_tuslah.py
      - name: Smoke test portable executable
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/RainyTeacher.exe").Path
          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 15
            $process.Refresh()
            if ($process.HasExited) {
              throw "RainyTeacher.exe exited during startup with code $($process.ExitCode)."
            }
          } finally {
            $process.Refresh()
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }
      - name: Verify PowerPoint exports
        run: python -m unittest discover -s tests -v
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        run: iscc /DAppVersion=1.7.2 installer.iss
      - name: Save installer and portable app
        uses: actions/upload-artifact@v4
        with:
          name: Rainy-Teacher-Windows-1.7.2
          path: |
            dist-installer/RainyTeacher-Setup-1.7.2.exe
            dist/RainyTeacher.exe
          if-no-files-found: error
